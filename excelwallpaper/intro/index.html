<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WhaleSchedule · 片头动画</title>
<style>
/* ==========================================================================
   WhaleSchedule 片头动画（B站视频用）
   时长 5.0 秒，纯 CSS 实现，零外部依赖。
   配色严格取自壁纸的设计令牌（见 excelwallpaper/index.html 的 :root），
   所以片头与壁纸风格天然统一，不会出现「硬科技风配二次元壁纸」的违和。
   用法：浏览器打开 → F11 全屏 → 录屏（OBS / Xbox Game Bar）→ 录满 5 秒即可。
   ========================================================================== */
:root{
  --primary:        #3A49A5;
  --primary-dark:   #2A3578;
  --primary-light:  #8FA3EA;
  --accent:         #4C7BE0;
  --gold:           #D8A752;
  --gold-bright:    #EFCB7C;
  --text-title:     #2A3578;
  --text-secondary: #6E789E;
  --border:         #C9D4EE;
}

*{ margin:0; padding:0; box-sizing:border-box; }

html,body{
  width:100%; height:100%;
  overflow:hidden;
  background:#0F1633;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}

/* 舞台：固定 1920×1080，按窗口等比缩放，保证录出来构图不变 */
#stage{
  position:absolute;
  left:50%; top:50%;
  width:1920px; height:1080px;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(var(--fit,1));
  overflow:hidden;
  background:
    radial-gradient(1200px 800px at 50% 42%, #2C3E8C 0%, #1B2559 45%, #0F1633 100%);
}

/* 光晕：呼吸式扩散，给画面一点「活气」 */
.glow{
  position:absolute; left:50%; top:44%;
  width:1500px; height:1100px;
  margin-left:-750px; margin-top:-550px;
  background:radial-gradient(closest-side, rgba(143,163,234,.30), rgba(143,163,234,0) 70%);
  opacity:0;
  animation:glowIn 4.6s ease-out .1s both;
}
@keyframes glowIn{
  0%{ opacity:0; transform:scale(.86); }
  35%{ opacity:.85; transform:scale(1); }
  100%{ opacity:.30; transform:scale(1.06); }
}

/* 轻雪：复用壁纸的飘雪氛围，但更轻更慢 */
.snow{ position:absolute; inset:0; opacity:0; animation:snowIn 1.2s ease-out 2.2s both; }
@keyframes snowIn{ from{opacity:0} to{opacity:.75} }
.snow i{
  position:absolute;
  width:5px; height:5px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  box-shadow:0 0 6px rgba(200,220,255,.75);
  animation:fall linear infinite;
}
@keyframes fall{
  from{ transform:translateY(-60px) translateX(0); }
  to  { transform:translateY(1160px) translateX(26px); }
}

/* ---------- 表格卡片 ---------- */
/* 纵向版式（1920×1080）：
     标题    y 116–254
     副标题  y 268–312
     卡片    y 392–812   ← 标题/副标题都在卡片【上方】，不重叠
     人物    锚在底部 150px，与卡片左右两侧不在同一水平带 → 不打架
   第一版把卡片放在 top:50%、标题放在 top:232，结果标题压进卡片 40px，已修正。 */
.card{
  position:absolute;
  left:50%; top:420px;
  width:1000px; height:420px;
  margin-left:-500px;
  border-radius:18px;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(201,212,238,.9);
  box-shadow:0 26px 70px rgba(10,18,50,.5), 0 0 0 1px rgba(143,163,234,.25) inset;
  opacity:0;
  animation:cardIn .85s cubic-bezier(.22,1,.36,1) .35s both;
}
@keyframes cardIn{
  from{ opacity:0; transform:translateY(64px) scale(.95); }
  to  { opacity:1; transform:translateY(0)    scale(1); }
}

/* 卡片标题栏（靛蓝渐变，和壁纸工具栏一致） */
.card-bar{
  height:64px;
  border-radius:18px 18px 0 0;
  background:linear-gradient(135deg, var(--primary-dark), var(--primary));
  border-bottom:2px solid var(--gold);
  display:flex; align-items:center; gap:16px;
  padding:0 26px;
}
.card-bar b{
  color:#fff; font-size:20px; font-weight:600; letter-spacing:.5px;
}
.card-bar s{
  color:rgba(255,255,255,.62); font-size:15px; text-decoration:none; margin-left:auto;
}

/* 表头 */
.card-head{
  display:flex; gap:14px;
  padding:16px 26px 12px;
  border-bottom:1px solid rgba(201,212,238,.8);
}
.card-head u{
  height:16px; border-radius:4px; text-decoration:none;
  background:linear-gradient(90deg, var(--primary), var(--primary-light));
  opacity:.85;
}

/* 数据行：每行淡入 + 勾选框「亮一下」 */
.card-row{
  display:flex; gap:14px; align-items:center;
  height:52px; padding:0 26px;
  border-bottom:1px solid rgba(238,242,251,.95);
  opacity:0;
  animation:rowIn .5s ease-out both;
}
.card-row:nth-child(odd){ background:rgba(238,242,251,.55); }
@keyframes rowIn{ from{opacity:0; transform:translateX(-14px)} to{opacity:1; transform:none} }

.card-row u{ height:14px; border-radius:4px; background:#CBD6EE; text-decoration:none; }
.card-row em{
  width:26px; height:26px; flex:0 0 auto;
  border-radius:6px;
  border:1.5px solid var(--border);
  background:#fff;
  margin-left:auto;
  position:relative;
}
/* 勾选的四处：依次亮起 + 对勾浮现 */
.card-row em.on::after{
  content:"";
  position:absolute; left:7px; top:3px;
  width:8px; height:14px;
  border-right:2.5px solid #fff;
  border-bottom:2.5px solid #fff;
  transform:rotate(42deg);
}
.card-row em.on{
  background:linear-gradient(135deg, var(--accent), var(--primary));
  border-color:var(--accent);
  animation:tick 1.6s ease-out both;
}
@keyframes tick{
  0%{ box-shadow:0 0 0 0 rgba(76,123,224,.55); }
  60%{ box-shadow:0 0 0 14px rgba(76,123,224,0); }
  100%{ box-shadow:0 0 0 0 rgba(76,123,224,0); }
}

/* ---------- 鲸鱼娘 ---------- */
/* 裁切参数直接取自「生产壁纸实测值」，不另写一套算法（我第一版就是这么错的）：
   生产 walkerMetrics: contentX=552 contentW=471 scale=0.2653928
   生产实测：裁切窗 145×133 里人物可见 99×126、左余 10px、右余 36px
   片头放大 3 倍 → 窗口 435×400，img 宽 1222.93px，左移 409.49px、上移 208.60px。
   注意 margin-left 是 -409.49 而不是 -(552×scale×3)=-439.5：
   后者会把人物**再往左推 30px**，正好把左肩切掉（第一版就是这个错）。 */
.fig{
  position:absolute;
  /* 两个数都是按视觉核验结果调的，别随手改：
     left:330  → 人物可见区从窗口内 x=30 开始，放 330 才不会被窗口左缘切掉左肩
     bottom:150 → 窗口底边落在 y=930，而人物脚底约在 y=901，
                  给脚下留出约 30px；原来 bottom:150 且窗口更高时脚会顶到画面底边被切 */
  left:330px; bottom:150px;
  width:435px; height:400px;      /* 145×133 的三倍 */
  overflow:hidden;
  opacity:0;
  animation:figIn .8s cubic-bezier(.22,1,.36,1) 1.15s both;
}
@keyframes figIn{
  from{ opacity:0; transform:translateX(-110px); }
  to  { opacity:1; transform:translateX(0); }
}
.fig img{
  width:1222.93px;                /* 1536 × 0.2653928 × 3 */
  margin-left:-409.49px;          /* -(552 × 0.2653928 - 10) × 3 */
  margin-top:-208.60px;           /* -(262 × 0.2653928) × 3 */
  display:block;
  image-rendering:auto;
  filter:drop-shadow(0 10px 24px rgba(10,18,50,.45));
}
/* 轻微上下浮动，避免「贴图感」 */
.fig-inner{ animation:bob 2.6s ease-in-out 2.0s infinite; }
@keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

/* ---------- 标题 ---------- */
.title{
  position:absolute; left:0; right:0; top:140px;
  text-align:center;
  font-size:104px; font-weight:800;
  letter-spacing:4px;
  color:#fff;
  text-shadow:0 6px 30px rgba(76,123,224,.55), 0 2px 6px rgba(10,18,50,.4);
}
.title span{
  display:inline-block;
  opacity:0;
  animation:charIn .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes charIn{
  from{ opacity:0; transform:translateY(26px) scale(1.06); filter:blur(10px); }
  to  { opacity:1; transform:none; filter:blur(0); }
}

/* 副标题：打字机 */
.sub{
  position:absolute; left:0; right:0; top:292px;
  text-align:center;
  font-size:34px; font-weight:500; letter-spacing:6px;
  color:var(--gold-bright);
  text-shadow:0 2px 14px rgba(216,167,82,.35);
}
.sub-inner{
  display:inline-block;
  white-space:nowrap;
  overflow:hidden;
  vertical-align:bottom;
  width:0;
  animation:type .95s steps(13,end) 1.55s both;
}
@keyframes type{ from{width:0} to{width:13em} }
.sub-caret{
  display:inline-block;
  width:2px; height:1em;
  margin-left:4px;
  background:var(--gold-bright);
  vertical-align:-2px;
  animation:caret .7s steps(1) 1.55s 3 both;
}
@keyframes caret{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* 整体缓慢推近（收尾时略有呼吸感） */
.zoom{
  position:absolute; inset:0;
  animation:zoomIn 4.7s ease-out 0s both;
}
@keyframes zoomIn{
  from{ transform:scale(1); }
  to  { transform:scale(1.025); }
}

/* 片尾淡出（5 秒处收尾；录屏时正好结束） */
.fadeout{
  position:absolute; inset:0;
  background:#0F1633;
  opacity:0;
  pointer-events:none;
  animation:fadeOut .55s ease-in 4.45s both;
}
@keyframes fadeOut{ from{opacity:0} to{opacity:1} }

/* 片头期间的水印/提示已移除：
   原来这里有一行「WhaleSchedule 片头 · 5 秒 · 纯 CSS」，实测对比度只有 2.6:1、
   几乎看不见，而且位置正压在人物腿上，属于纯粹的视觉噪音。 */
</style>
</head>
<body>
<div id="stage">

  <div class="zoom">
    <div class="glow"></div>

    <div class="snow" id="snow"></div>

    <!-- 表格卡片：模拟壁纸的面板，作为构图主体 -->
    <div class="card">
      <div class="card-bar">
        <b>课程管理</b><s>共 8 门</s>
      </div>
      <div class="card-head">
        <u style="flex:0 0 190px"></u>
        <u style="flex:0 0 96px"></u>
        <u style="flex:0 0 96px"></u>
        <u style="flex:0 0 96px"></u>
        <u style="flex:0 0 96px"></u>
        <u style="flex:0 0 120px"></u>
      </div>
      <div id="rows"></div>
    </div>

    <!-- 鲸鱼娘：真实素材切图 -->
    <div class="fig">
      <div class="fig-inner">
        <img src="../image/chibi-smile.png" alt="">
      </div>
    </div>

    <!-- 标题 -->
    <div class="title" id="title"></div>
    <div class="sub"><span class="sub-inner" id="sub"></span><span class="sub-caret"></span></div>
  </div>

  <div class="fadeout"></div>
</div>

<script>
(function(){
  // ---------- 1. 舞台等比缩放适配窗口 ----------
  function fit(){
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById('stage').style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- 2. 标题逐字生成 ----------
  var TITLE = 'WhaleSchedule';
  var titleEl = document.getElementById('title');
  TITLE.split('').forEach(function(ch, i){
    var s = document.createElement('span');
    s.textContent = ch;
    // 1.05s 起，每字错开 55ms
    s.style.animationDelay = (1.05 + i * 0.055).toFixed(3) + 's';
    titleEl.appendChild(s);
  });

  // ---------- 3. 副标题（打字机字符） ----------
  // 用不换行空格保证 steps() 的宽度节奏稳定
  document.getElementById('sub').textContent = '课程管理\u00A0·\u00A0鲸鱼娘壁纸';

  // ---------- 4. 数据行：6 行，其中 4 行勾选（前 4 行按顺序逐行亮起） ----------
  var rows = document.getElementById('rows');
  var plan = [
    { w: 190, on: true  },
    { w: 150, on: true  },
    { w: 210, on: false },
    { w: 170, on: true  },
    { w: 200, on: true  },
    { w: 160, on: false }
  ];
  plan.forEach(function(p, i){
    var r = document.createElement('div');
    r.className = 'card-row';
    r.style.animationDelay = (0.95 + i * 0.1).toFixed(2) + 's';
    var bar = document.createElement('u');
    bar.style.width = p.w + 'px';
    r.appendChild(bar);
    var box = document.createElement('em');
    if (p.on) {
      box.className = 'on';
      // 勾选在行出现之后依次亮起
      box.style.animationDelay = (1.75 + i * 0.16).toFixed(2) + 's';
    }
    r.appendChild(box);
    rows.appendChild(r);
  });

  // ---------- 5. 飘雪 ----------
  var snow = document.getElementById('snow');
  for (var i = 0; i < 34; i++){
    var d = document.createElement('i');
    var size = (2 + Math.random() * 4).toFixed(1);
    d.style.left = (Math.random() * 100).toFixed(2) + '%';
    d.style.width = size + 'px';
    d.style.height = size + 'px';
    d.style.opacity = (0.25 + Math.random() * 0.55).toFixed(2);
    d.style.animationDuration = (5.5 + Math.random() * 5).toFixed(2) + 's';
    d.style.animationDelay = (-Math.random() * 8).toFixed(2) + 's';
    snow.appendChild(d);
  }

  // ---------- 6. 录屏友好：5 秒后冻结在最后一帧 ----------
  // 避免录屏时动画无限循环、后段不好剪。
  setTimeout(function(){
    document.getAnimations().forEach(function(a){
      try { a.pause(); } catch(e){}
    });
  }, 5050);
})();
</script>
</body>
</html>
