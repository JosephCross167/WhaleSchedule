<!doctype html>
<html><head><meta charset="utf-8"><title>bgcompare</title></head>
<body><pre id="out">PENDING</pre>
<script>
const A_SRC = 'bg_cur.png';
const B_SRC = 'bg_orig.jpg';
const R = {};

function loadImg(src){
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('load fail ' + src));
    i.src = src;
  });
}
function mk(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = 'high';
  return { c, x };
}
function srcW(s){ return s.naturalWidth || s.width; }
function srcH(s){ return s.naturalHeight || s.height; }

// progressive halving downscale for quality
function scaledGray(src, tw, th){
  let cur = src, sw = srcW(src), sh = srcH(src);
  while (sw / 2 >= tw && sh / 2 >= th && sw > 2 && sh > 2){
    const nw = Math.max(tw, Math.floor(sw / 2)), nh = Math.max(th, Math.floor(sh / 2));
    const { c, x } = mk(nw, nh);
    x.drawImage(cur, 0, 0, nw, nh);
    cur = c; sw = nw; sh = nh;
  }
  const { c, x } = mk(tw, th);
  x.drawImage(cur, 0, 0, tw, th);
  return gray(x.getImageData(0, 0, tw, th));
}
function gray(id){
  const d = id.data, n = id.width * id.height, g = new Float64Array(n);
  for (let i = 0; i < n; i++){
    g[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];
  }
  g.w = id.width; g.h = id.height;
  return g;
}
function cropScaledGray(src, sx, sy, sw, sh, tw, th){
  const { c, x } = mk(tw, th);
  x.drawImage(src, sx, sy, sw, sh, 0, 0, tw, th);
  return gray(x.getImageData(0, 0, tw, th));
}
function ncc(a, b){
  const n = Math.min(a.length, b.length);
  let ma = 0, mb = 0;
  for (let i = 0; i < n; i++){ ma += a[i]; mb += b[i]; }
  ma /= n; mb /= n;
  let sa = 0, sb = 0, sab = 0;
  for (let i = 0; i < n; i++){
    const da = a[i] - ma, db = b[i] - mb;
    sa += da*da; sb += db*db; sab += da*db;
  }
  return (sa <= 0 || sb <= 0) ? 0 : sab / Math.sqrt(sa*sb);
}
function mae(a, b){
  const n = Math.min(a.length, b.length);
  let s = 0;
  for (let i = 0; i < n; i++) s += Math.abs(a[i] - b[i]);
  return s / n;
}
function gradEnergy(g){
  const w = g.w, h = g.h;
  let s = 0, c = 0;
  for (let y = 1; y < h-1; y++){
    for (let x = 1; x < w-1; x++){
      const i = y*w + x;
      const gx = Math.abs(g[i+1] - g[i-1]) / 2;
      const gy = Math.abs(g[i+w] - g[i-w]) / 2;
      s += Math.max(gx, gy); c++;
    }
  }
  return s / c;
}
// sharpness normalized: grad energy relative to contrast (std)
function sharp(g){
  const ge = gradEnergy(g);
  const n = g.length; let m = 0;
  for (let i = 0; i < n; i++) m += g[i];
  m /= n;
  let v = 0;
  for (let i = 0; i < n; i++){ const d = g[i]-m; v += d*d; }
  return { grad: +ge.toFixed(3), std: +Math.sqrt(v/n).toFixed(3),
           rel: +(ge / (Math.sqrt(v/n) || 1)).toFixed(4) };
}
function edgeStats(g, frac){
  const w = g.w, h = g.h;
  const bw = Math.max(1, Math.round(w*frac)), bh = Math.max(1, Math.round(h*frac));
  const region = (x0, y0, x1, y1) => {
    let s = 0, c = 0;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++){ s += g[y*w+x]; c++; }
    return +(s/c).toFixed(2);
  };
  return {
    left:  region(0, 0, bw, h),
    right: region(w-bw, 0, w, h),
    top:   region(0, 0, w, bh),
    bot:   region(0, h-bh, w, h)
  };
}
function rgbaStats(id){
  const d = id.data, n = id.width*id.height;
  let r=0,g=0,b=0;
  for (let i=0;i<n;i++){ r+=d[i*4]; g+=d[i*4+1]; b+=d[i*4+2]; }
  return [Math.round(r/n), Math.round(g/n), Math.round(b/n)];
}

(async () => {
  try {
    const A = await loadImg(A_SRC);
    const B = await loadImg(B_SRC);
    const aw = srcW(A), ah = srcH(A), bw = srcW(B), bh = srcH(B);
    R.size = { A: [aw, ah], B: [bw, bh] };
    R.aspect = { A: +(aw/ah).toFixed(5), B: +(bw/bh).toFixed(5) };
    R.scaleIfSameFraming = { wRatio: +(bw/aw).toFixed(5), hRatio: +(bh/ah).toFixed(5) };

    const LW = 418, LH = 235;
    const aLow = scaledGray(A, LW, LH);
    const bLowSquash = scaledGray(B, LW, LH);
    R.globalSquash = { ncc: +ncc(aLow, bLowSquash).toFixed(5), mae: +mae(aLow, bLowSquash).toFixed(3) };

    // B center-cropped to A aspect, then scaled
    const aAsp = aw/ah;
    let cw = Math.min(bw, bh*aAsp), ch = cw/aAsp;
    if (ch > bh){ ch = bh; cw = ch*aAsp; }
    const bLowCrop = cropScaledGray(B, (bw-cw)/2, (bh-ch)/2, cw, ch, LW, LH);
    R.globalCenterCrop = { crop: [+cw.toFixed(1), +ch.toFixed(1)],
      ncc: +ncc(aLow, bLowCrop).toFixed(5), mae: +mae(aLow, bLowCrop).toFixed(3) };

    // ---- search: is A a scaled/cropped sub-window of B? ----
    const results = [];
    for (let w0 = Math.min(bw, Math.floor(bh*aAsp)); w0 >= 1400; w0 -= 20){
      const h0 = w0 / aAsp;
      if (h0 > bh) continue;
      const maxdx = Math.max(0, Math.floor((bw - w0)));
      const maxdy = Math.max(0, Math.floor((bh - h0)));
      const dxs = new Set([0]);
      for (let d = 12; d <= maxdx; d += 12){ dxs.add(d); dxs.add(-d); }
      const dys = new Set([0]);
      for (let d = 12; d <= maxdy; d += 12){ dys.add(d); dys.add(-d); }
      for (const dx of dxs){
        for (const dy of dys){
          const sx = (bw - w0)/2 + dx, sy = (bh - h0)/2 + dy;
          if (sx < 0 || sy < 0 || sx + w0 > bw || sy + h0 > bh) continue;
          const g = cropScaledGray(B, sx, sy, w0, h0, LW, LH);
          const c = ncc(aLow, g);
          results.push({ w0, h0: +h0.toFixed(1), dx: +dx.toFixed(1), dy: +dy.toFixed(1),
                         ncc: +c.toFixed(5), mae: +mae(aLow, g).toFixed(3) });
        }
      }
    }
    results.sort((p, q) => q.ncc - p.ncc);
    R.searchTop = results.slice(0, 6);
    R.searchCount = results.length;
    const best = results[0];
    R.bestMatch = best;
    R.bestVsFullB = { bestCropW: best.w0, bWidth: bw, extraPxRightLeft: +((bw - best.w0)).toFixed(1),
                      bestCropH: +best.h0.toFixed(1), bHeight: bh, extraPxTopBot: +((bh - best.h0)).toFixed(1) };

    // ---- native sharpness ----
    R.sharpA_native = sharp(gray((() => { const {c,x} = mk(aw, ah); x.drawImage(A,0,0); return x.getImageData(0,0,aw,ah); })()));
    R.sharpB_native = sharp(gray((() => { const {c,x} = mk(bw, bh); x.drawImage(B,0,0); return x.getImageData(0,0,bw,bh); })()));

    // ---- sharpness at matched size (both -> A size) ----
    const aAtA = scaledGray(A, aw, ah);
    const bAtA = scaledGray(B, aw, ah);
    R.sharp_matched = { A: sharp(aAtA), B_downscaledToA: sharp(bAtA) };
    // both to 1200x675
    const aS = scaledGray(A, 1200, 675), bS = scaledGray(B, 1200, 675);
    R.sharp_at1200 = { A: sharp(aS), B: sharp(bS) };

    // ---- detail-floor test: downscale to X then back up, compare to original ----
    function roundTrip(src, nativeW, nativeH, smallW, label){
      const small = mk(smallW, Math.round(smallW*nativeH/nativeW));
      small.x.drawImage(src, 0, 0, small.c.width, small.c.height);
      const { c, x } = mk(nativeW, nativeH);
      x.drawImage(small.c, 0, 0, nativeW, nativeH);
      const up = gray(x.getImageData(0, 0, nativeW, nativeH));
      const { c: c2, x: x2 } = mk(nativeW, nativeH);
      x2.drawImage(src, 0, 0, nativeW, nativeH);
      const orig = gray(x2.getImageData(0, 0, nativeW, nativeH));
      return { label, ncc: +ncc(orig, up).toFixed(5), mae: +mae(orig, up).toFixed(3) };
    }
    R.roundTrip = {
      A_half: roundTrip(A, aw, ah, Math.round(aw/2), 'A->836->1672'),
      A_third: roundTrip(A, aw, ah, Math.round(aw/3), 'A->557->1672'),
      B_half: roundTrip(B, bw, bh, Math.round(bw/2), 'B->900->1800'),
      B_third: roundTrip(B, bw, bh, Math.round(bw/3), 'B->600->1800')
    };

    // ---- edge content ----
    const aNative = gray((() => { const {c,x} = mk(aw,ah); x.drawImage(A,0,0); return x.getImageData(0,0,aw,ah); })());
    const bNative = gray((() => { const {c,x} = mk(bw,bh); x.drawImage(B,0,0); return x.getImageData(0,0,bw,bh); })());
    R.edgesNative = { A: edgeStats(aNative, 0.03), B: edgeStats(bNative, 0.03) };
    // edges at matched size
    const aLow2 = scaledGray(A, LW, LH), bLow2 = scaledGray(B, LW, LH);
    R.edgesMatched = { A: edgeStats(aLow2, 0.03), B: edgeStats(bLow2, 0.03) };
    // per-edge strip NCC at matched size (compare 3% strips)
    function stripNCC(g1, g2, side, frac){
      const w = g1.w, h = g1.h;
      const bw2 = Math.max(1, Math.round(w*frac)), bh2 = Math.max(1, Math.round(h*frac));
      let x0=0,y0=0,x1=w,y1=h;
      if (side==='left'){ x1 = bw2; }
      if (side==='right'){ x0 = w-bw2; }
      if (side==='top'){ y1 = bh2; }
      if (side==='bot'){ y0 = h-bh2; }
      const a=[], b=[];
      for (let y=y0;y<y1;y++) for (let x=x0;x<x1;x++){ a.push(g1[y*w+x]); b.push(g2[y*w+x]); }
      return +ncc(a,b).toFixed(5);
    }
    R.stripNCC_matched = {};
    for (const s of ['left','right','top','bot']) R.stripNCC_matched[s] = stripNCC(aLow2, bLow2, s, 0.03);
    R.stripNCC_matched_10pct = {};
    for (const s of ['left','right','top','bot']) R.stripNCC_matched_10pct[s] = stripNCC(aLow2, bLow2, s, 0.10);

    // ---- quadrant NCC at matched size ----
    R.quadNCC = {};
    {
      const w = LW, h = LH;
      for (const [name, qx0, qy0, qx1, qy1] of [
        ['TL',0,0,w/2,h/2],['TR',w/2,0,w,h/2],['BL',0,h/2,w/2,h],['BR',w/2,h/2,w,h]]){
        const a=[],b=[];
        for (let y=Math.floor(qy0);y<Math.floor(qy1);y++) for (let x=Math.floor(qx0);x<Math.floor(qx1);x++){ a.push(aLow2[y*w+x]); b.push(bLow2[y*w+x]); }
        R.quadNCC[name] = +ncc(a,b).toFixed(5);
      }
    }

    // mean colors
    R.meanColor = {
      A: rgbaStats((() => { const {c,x} = mk(aw,ah); x.drawImage(A,0,0); return x.getImageData(0,0,aw,ah); })()),
      B: rgbaStats((() => { const {c,x} = mk(bw,bh); x.drawImage(B,0,0); return x.getImageData(0,0,bw,bh); })())
    };

    R.ok = true;
  } catch (e) {
    R.ok = false;
    R.error = String(e && e.message ? e.message : e);
  }
  document.getElementById('out').textContent = JSON.stringify(R, null, 1);
  document.title = 'DONE';
})();
</script>
</body></html>
